services:
  app:
    build: .
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/urlshortener
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
